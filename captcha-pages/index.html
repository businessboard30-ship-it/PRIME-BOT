<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Verify you're human · Prime Bot</title>
<style>
:root{--bg:#0b0d14;--accent:#5865F2;--accent2:#7289DA;--text:#e8e9ee;--muted:#9aa0ae}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
background:radial-gradient(1200px 600px at 50% -10%,#1b2140 0%,var(--bg) 60%);color:var(--text)}
.card{width:min(92vw,420px);padding:2rem 1.5rem;text-align:center;border:1px solid #2a2f45;border-radius:16px;background:#12162099}
h1{margin:.2rem 0 .5rem;font-size:1.5rem}p{color:var(--muted);margin:.4rem 0 1.2rem}
#widget{display:flex;justify-content:center;min-height:70px}
#msg{margin-top:1.2rem;font-weight:600}.ok{color:#43b581}.err{color:#f04747}
</style></head><body>
<main class="card">
  <div style="font-size:2.2rem">🧩</div>
  <h1>Quick security check</h1>
  <p>Confirm you're a real person to unlock the Discord server.</p>
  <div id="widget"></div>
  <div id="msg" role="status"></div>
</main>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
(async () => {
  const msg = document.getElementById("msg");
  const say = (t, cls) => { msg.textContent = t; msg.className = cls || ""; };
  const token = new URLSearchParams(location.search).get("t");
  if (!token) return say("Missing link — click the verify button in Discord to get a fresh one.", "err");
  let cfg;
  try { cfg = await (await fetch("config.json", {cache: "no-store"})).json(); }
  catch { return say("Page isn't configured yet.", "err"); }
  const waitForTurnstile = () => new Promise(r => { const t = setInterval(() => { if (window.turnstile) { clearInterval(t); r(); } }, 50); });
  await waitForTurnstile();
  turnstile.render("#widget", {
    sitekey: cfg.turnstile_site_key, theme: "dark",
    callback: async (cf_token) => {
      say("Checking…");
      try {
        const res = await fetch(cfg.api_base.replace(/\/$/, "") + "/api/verify_captcha", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({token, cf_token}),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) { say("✅ " + data.message, "ok"); document.getElementById("widget").style.display = "none"; }
        else { say(data.message || "Verification failed.", "err"); turnstile.reset(); }
      } catch { say("Couldn't reach the server. Try again.", "err"); turnstile.reset(); }
    },
    "error-callback": () => say("Captcha failed to load. Refresh and try again.", "err"),
  });
})();
</script></body></html>
