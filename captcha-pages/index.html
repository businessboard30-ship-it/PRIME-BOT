<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="dark">
<title>Verify you're human</title>
<style>
:root{--ink:#000;--paint:#fff;--dim:rgba(255,255,255,.62);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paint);font-family:var(--serif);overflow:hidden}
#art{position:fixed;inset:0;width:100%;height:100%}
#cracks{filter:url(#glow)}
#cracks path{fill:none;stroke:var(--paint);stroke-linecap:round;stroke-linejoin:round;
stroke-dasharray:1;stroke-dashoffset:1;animation:flow 3.2s cubic-bezier(.3,.1,.2,1) forwards;
transition:stroke-width 1.6s ease}
body.done #cracks path{stroke-width:calc(var(--w) * 2.6)}
.drip rect{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:grow var(--t) cubic-bezier(.4,0,.2,1) var(--d) forwards}
.drip circle{transform:translateY(0);animation:fall var(--t) cubic-bezier(.4,0,.2,1) var(--d) forwards}
@keyframes flow{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes fall{to{transform:translateY(var(--h))}}
main{position:relative;z-index:1;min-height:100%;display:grid;place-content:center;justify-items:center;
padding:2rem 1.5rem;text-align:center}
main::before{content:"";position:absolute;inset:50% auto auto 50%;width:min(130vw,760px);height:min(110vh,560px);
transform:translate(-50%,-50%);background:radial-gradient(closest-side,#000 55%,rgba(0,0,0,0));z-index:-1}
h1{margin:0;font-weight:700;font-style:italic;font-size:clamp(2.6rem,9vw,5rem);line-height:.98;letter-spacing:-.02em}
p{margin:1.1rem 0 1.8rem;color:var(--dim);font-size:1.1rem;line-height:1.5;max-width:30ch}
#widget{min-height:70px;display:flex;justify-content:center}
#msg{min-height:1.6em;margin-top:1.4rem;font-size:1.05rem;font-style:italic}
#msg.err{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
@media (prefers-reduced-motion:reduce){#cracks path,.drip rect,.drip circle{animation-duration:.01s;animation-delay:0s}}
</style></head><body>
<svg id="art" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g id="cracks"></g>
  <g id="drips" fill="#fff"><rect x="0" y="0" width="1600" height="9"/></g>
</svg>
<main>
  <h1 id="title">Prove you're human.</h1>
  <p id="sub">One quick check and the server unlocks on its own.</p>
  <div id="widget"></div>
  <div id="msg" role="status"></div>
</main>
<noscript><main><h1>Turn on JavaScript.</h1></main></noscript>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
// --- paint: seeded so the cracks look the same on every visit ---------------
(function art(){
  let s=0x9e3779b9; const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const NS="http://www.w3.org/2000/svg", cracks=document.getElementById("cracks"), drips=document.getElementById("drips");
  let n=0;
  function vein(x,y,a,len,w,depth){
    let d=`M${x.toFixed(1)} ${y.toFixed(1)}`, run=0, kids=[];
    while(run<len){
      const step=16+r()*26; a+=(r()-.5)*.62; x+=Math.cos(a)*step; y+=Math.sin(a)*step; run+=step;
      d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;
      if(depth<3&&r()<.11) kids.push([x,y,a+(r()<.5?-1:1)*(.45+r()*.8),len*(.35+r()*.3),w*.62,depth+1]);
    }
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",d); p.setAttribute("pathLength","1"); p.style.setProperty("--w",w);
    p.style.strokeWidth=w; p.style.animationDelay=(depth*.55+r()*.5)+"s"; cracks.appendChild(p);
    kids.forEach(k=>vein(...k));
  }
  const arms=9;
  for(let i=0;i<arms;i++) vein(800+(r()-.5)*60,500+(r()-.5)*40,(i/arms)*Math.PI*2+r()*.5,520+r()*380,3.4-r()*1.2,0);
  // a few thick veins that run in from the edges
  for(let i=0;i<4;i++) vein(r()<.5?-10:1610,80+r()*840,r()<.5?0:Math.PI,380+r()*260,4.2,1);
  for(let i=0;i<26;i++){
    const x=20+r()*1560, w=2.5+r()*5.5, h=40+Math.pow(r(),2)*330, t=(2.4+r()*4.6)+"s", dl=(.4+r()*2.2)+"s";
    const g=document.createElementNS(NS,"g"); g.setAttribute("class","drip");
    g.style.setProperty("--t",t); g.style.setProperty("--d",dl); g.style.setProperty("--h",h+"px");
    g.innerHTML=`<rect x="${(x-w/2).toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${h.toFixed(0)}"/><circle cx="${x.toFixed(1)}" cy="0" r="${(w*.95).toFixed(1)}"/>`;
    drips.appendChild(g);
  }
})();

// --- verification -----------------------------------------------------------
(async () => {
  const msg=document.getElementById("msg"), title=document.getElementById("title"), sub=document.getElementById("sub");
  const say=(t,cls)=>{msg.textContent=t;msg.className=cls||""};
  const token=new URLSearchParams(location.search).get("t");
  if(!token){ title.textContent="This link is empty."; sub.textContent="Press the verify button in Discord to get a fresh one."; return; }
  let cfg;
  try{ cfg=await (await fetch("config.json",{cache:"no-store"})).json(); }
  catch{ return say("This page isn't set up yet.","err"); }
  await new Promise(res=>{const t=setInterval(()=>{if(window.turnstile){clearInterval(t);res()}},50)});
  turnstile.render("#widget",{
    sitekey:cfg.turnstile_site_key, theme:"dark",
    callback: async (cf_token)=>{
      say("Checking…");
      try{
        const res=await fetch(cfg.api_base.replace(/\/$/,"")+"/api/verify_captcha",{
          method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,cf_token})});
        const data=await res.json().catch(()=>({}));
        if(res.ok&&data.ok){
          document.body.classList.add("done");
          document.getElementById("widget").style.display="none";
          title.textContent="You're verified."; sub.textContent="Go back to Discord. The server is open."; say("");
        } else { say(data.message||"That didn't work. Try again.","err"); turnstile.reset(); }
      }catch{ say("Couldn't reach the server. Try again.","err"); turnstile.reset(); }
    },
    "error-callback":()=>say("The check didn't load. Refresh the page.","err"),
  });
})();
</script></body></html>
