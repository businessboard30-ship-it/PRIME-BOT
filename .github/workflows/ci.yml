name: Catch game CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Compile changed modules
        run: python -m compileall -q modules database.py discord_bot/bot.py
      - name: Lint catch modules
        run: ruff check modules/catch_*.py tests/unit/test_catch_*.py
      - name: Run tests
        run: pytest -q
