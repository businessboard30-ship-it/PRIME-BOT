name: Catch CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint catch game (undefined names, unused imports, syntax)
        run: |
          python -m pip install ruff
          ruff check --select F,E9 modules/catch_*.py discord_bot/cogs/catch.py scripts/import_catch_assets.py tests/unit/test_catch_*.py
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
