name: Dependency audit

# Runs when a dependency file changes in a PR, and weekly, because new advisories
# appear without any commit. Kept separate from CI so a newly published advisory
# never turns an unrelated PR red.
on:
  pull_request:
    paths:
      - requirements.txt
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # Currently clean, so this one gates: a PR that adds a vulnerable Python
    # dependency fails here.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  node:
    # ADVISORY for now. `pnpm audit --prod` reports high/critical advisories that
    # come from next@16.2.6 (fixed in >=16.4.1) and from `shadcn`, a CLI that sits
    # in "dependencies". Once those two are dealt with, delete the `|| true`
    # handling below so this job gates like the Python one.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit (production dependencies, high and above)
        run: |
          status=0
          pnpm audit --prod --audit-level high > audit.txt 2>&1 || status=$?
          tail -n 60 audit.txt
          {
            echo "### pnpm audit --prod (high and above)"
            echo
            echo '```'
            tail -n 8 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=pnpm audit::production dependencies have high/critical advisories (advisory only, see job summary)"
          fi
          exit 0
