name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets, so only deploy previews for branches of this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) + CLOUDFLARE_ACCOUNT_ID,
      # and optional variable CF_PAGES_WEBSITE_PROJECT (default: prime-bot-site).
      # Calls wrangler through npx instead of cloudflare/wrangler-action: that action
      # sees pnpm-lock.yaml at the repo root and tries to run pnpm, which isn't installed here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Pages project if missing
        run: npx --yes wrangler@4 pages project create "${PROJECT}" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_WEBSITE_PROJECT || 'prime-bot-site' }}
      - name: Deploy
        # Pushes to main publish production; pull requests publish a preview deployment on their own branch alias.
        run: npx --yes wrangler@4 pages deploy website --project-name="${PROJECT}" --branch="${BRANCH}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_WEBSITE_PROJECT || 'prime-bot-site' }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
