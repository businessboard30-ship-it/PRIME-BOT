name: Deploy captcha-pages to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "captcha-pages/**"
      - ".github/workflows/deploy-captcha-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) + CLOUDFLARE_ACCOUNT_ID,
      # and optional variable CF_PAGES_PROJECT (default: prime-bot-verify).
      # Calls wrangler through npx instead of cloudflare/wrangler-action: that action
      # sees pnpm-lock.yaml at the repo root and tries to run pnpm, which isn't installed here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Pages project if missing
        run: npx --yes wrangler@4 pages project create "${PROJECT}" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'prime-bot-verify' }}
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy captcha-pages --project-name="${PROJECT}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'prime-bot-verify' }}
